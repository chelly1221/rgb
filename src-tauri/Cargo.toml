[package]
name = "rgb-switch"
version = "0.1.0"
description = "A small Windows RGB lighting switch"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rgb_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Windows entry point only calls the library and requires UAC elevation.
# Unit tests live in the library; do not create an elevated empty test harness.
[[bin]]
name = "rgb-switch"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
libloading = "0.8"
winreg = "0.55"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_System_Services", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_Devices_Display"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
